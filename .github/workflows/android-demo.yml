name: Android classroom demo APK

on:
  push:
    branches: [main]
    paths: ['mobile/**', 'BeautyAI/**', '.github/workflows/android-demo.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify shared web behavior
        run: node --test tests/static-client.test.mjs tests/report-model.test.mjs tests/key-session.test.mjs tests/ingredient-guidance.test.mjs
      - name: Install pinned app tooling and bundle public assets
        working-directory: mobile
        run: |
          npm ci --ignore-scripts
          npm run sync
      - name: Build installable demo APK and lint native wrapper
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest lintDebug --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            cd mobile/android
            ./gradlew connectedDebugAndroidTest --no-daemon
            adb pull /sdcard/Android/data/io.github.yumin0117.glowpick/files/GlowPick-Android.png ../../GlowPick-Android.png
      - name: Prepare APK and checksum
        if: success()
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk GlowPick-Android-demo.apk
          sha256sum GlowPick-Android-demo.apk > GlowPick-Android-demo.apk.sha256
      - name: Save verified classroom demo and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GlowPick-Android-demo
          retention-days: 30
          path: |
            GlowPick-Android-demo.apk
            GlowPick-Android-demo.apk.sha256
            GlowPick-Android.png
            mobile/android/app/build/reports/androidTests/
            mobile/android/app/build/outputs/androidTest-results/
            mobile/android/app/build/reports/lint-results-debug.html
